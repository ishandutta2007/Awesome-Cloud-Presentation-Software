<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .tagline-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 14px;
        fill: #64748b;
      }
      .pill-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }

      /* Animated dynamic background orbs */
      @keyframes floatSlow1 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(40px, -25px) scale(1.1); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes floatSlow2 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-35px, 30px) scale(0.92); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.65; }
      }
      @keyframes slideWave {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 360; }
      }
      @keyframes floatPill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }

      .floating-orb-1 {
        animation: floatSlow1 14s ease-in-out infinite, pulseGlow 8s ease-in-out infinite;
      }
      .floating-orb-2 {
        animation: floatSlow2 18s ease-in-out infinite, pulseGlow 10s ease-in-out infinite;
      }
      .wave-line {
        stroke-dasharray: 12 18;
        animation: slideWave 25s linear infinite;
      }
      .pill-float-1 {
        animation: floatPill 6s ease-in-out infinite;
      }
      .pill-float-2 {
        animation: floatPill 7s ease-in-out infinite 1s;
      }
      .pill-float-3 {
        animation: floatPill 6.5s ease-in-out infinite 2s;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Background Decorative Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1150" y1="0" x2="1150" y2="360" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Dynamic Background Glow Elements (Kept in background so title is never obscured) -->
  <g class="floating-orb-1" filter="url(#glow)">
    <circle cx="220" cy="110" r="130" fill="#0284c7" opacity="0.3" />
    <circle cx="980" cy="80" r="140" fill="#7c3aed" opacity="0.25" />
  </g>
  <g class="floating-orb-2" filter="url(#glow)">
    <circle cx="820" cy="270" r="160" fill="#ec4899" opacity="0.2" />
    <circle cx="150" cy="280" r="120" fill="#6366f1" opacity="0.25" />
  </g>

  <!-- Animated dynamic stream waves in distant background -->
  <path d="M 0 310 Q 300 240, 600 290 T 1200 270" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25" class="wave-line" />
  <path d="M 0 330 Q 300 280, 600 320 T 1200 300" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.2" class="wave-line" />

  <!-- Presentation Deck Illustrative Icons on Far Right (Safe distance from center title) -->
  <g transform="translate(940, 95)" opacity="0.85">
    <!-- Slide card 1 behind -->
    <rect x="25" y="15" width="160" height="100" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" opacity="0.5" transform="rotate(7 105 65)" />
    <!-- Slide card 2 main -->
    <rect x="0" y="0" width="170" height="110" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glowSubtle)" />
    <!-- Slide inner mock UI elements -->
    <rect x="15" y="15" width="60" height="8" rx="4" fill="#38bdf8" />
    <rect x="15" y="32" width="140" height="4" rx="2" fill="#475569" />
    <rect x="15" y="42" width="110" height="4" rx="2" fill="#334155" />
    <!-- Slide chart mock -->
    <rect x="20" y="72" width="16" height="22" rx="3" fill="#0284c7" />
    <rect x="44" y="60" width="16" height="34" rx="3" fill="#818cf8" />
    <rect x="68" y="52" width="16" height="42" rx="3" fill="#c084fc" />
    <rect x="92" y="65" width="16" height="29" rx="3" fill="#f472b6" />
    <circle cx="138" cy="74" r="14" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="60 30" />
  </g>

  <!-- Clear Center-Left Foreground Group for Guaranteed Legibility -->
  <g transform="translate(90, 80)">
    
    <!-- Category Micro-Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="230" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="14" cy="14" r="4" fill="#38bdf8" />
      <text x="26" y="19" class="pill-text" font-size="11" fill="#bae6fd" letter-spacing="1">CURATED ECOSYSTEM • 2026</text>
    </g>

    <!-- Main Title (Strictly Foregrounded & Crystal Clear) -->
    <text x="0" y="78" class="title-text" fill="url(#titleGrad)">Awesome Cloud Presentation Software</text>

    <!-- Subtitle -->
    <text x="0" y="122" class="subtitle-text">Browser-Based Slide Creation, Real-Time Collaboration &amp; AI Storytelling</text>

    <!-- Feature Pills / Highlights (Gentle float, below text) -->
    <g transform="translate(0, 160)">
      <!-- Pill 1 -->
      <g class="pill-float-1" transform="translate(0, 0)">
        <rect x="0" y="0" width="175" height="32" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
        <text x="16" y="21" class="pill-text">🚀 Real-Time Co-Editing</text>
      </g>
      <!-- Pill 2 -->
      <g class="pill-float-2" transform="translate(190, 0)">
        <rect x="0" y="0" width="185" height="32" rx="16" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
        <text x="16" y="21" class="pill-text" fill="#a5b4fc">✨ Generative AI Decks</text>
      </g>
      <!-- Pill 3 -->
      <g class="pill-float-3" transform="translate(390, 0)">
        <rect x="0" y="0" width="180" height="32" rx="16" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5" />
        <text x="16" y="21" class="pill-text" fill="#d8b4fe">💻 Open-Source Slides</text>
      </g>
      <!-- Pill 4 -->
      <g class="pill-float-1" transform="translate(585, 0)">
        <rect x="0" y="0" width="170" height="32" rx="16" fill="url(#cardGrad)" stroke="#f472b6" stroke-width="1" stroke-opacity="0.5" />
        <text x="16" y="21" class="pill-text" fill="#fbcfe8">📊 Interactive Pitching</text>
      </g>
    </g>

    <!-- Tagline -->
    <text x="2" y="228" class="tagline-text">Comprehensive guide comparing SaaS platforms, pricing models, free tiers, and GitHub open-source presentation engines.</text>
  </g>

  <!-- Banner Bottom Border Accent Line -->
  <rect x="0" y="357" width="1200" height="3" fill="url(#titleGrad)" />
</svg>
